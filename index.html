<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>釣魚人生</title>
<meta name="description" content="在八斗子開船、拋竿、搏魚的 3D 釣魚遊戲。瀏覽器直接玩，手機電腦都可以。">
<meta name="theme-color" content="#0e2747">
<!-- 加入主畫面後全螢幕（iPhone、Android） -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="釣魚人生">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
<style>
  /* 遊戲畫布填滿整個視窗；載入條疊在正中央（藍色，配合遊戲介面） */
  :root { --bg:#0e2747; --panel:#163a66; --edge:#ffffff; --fg:#ffffff; --muted:#cfe6ff; --bar:#5cc8ff; --danger:#ff8d7a; color-scheme: dark; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--fg);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; overscroll-behavior:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  #stage { position:fixed; inset:0; height:100dvh; }
  #unity-canvas { display:block; width:100%; height:100%; background:var(--bg); outline:none; touch-action:none; }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; pointer-events:none;
    padding:16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
  #overlay[hidden], #error[hidden], #a2hs[hidden] { display:none; }
  h1 { margin:0; text-shadow:0 3px 0 #08182e; font-size:clamp(28px, 6vw, 44px); font-weight:900; letter-spacing:.08em; }
  p { margin:0; color:var(--muted); font-size:15px; max-width:34em; line-height:1.6; }
  #track { width:min(360px, 80%); height:14px; border-radius:8px; background:var(--panel); border:2px solid var(--edge); overflow:hidden; }
  #fill { width:0%; height:100%; background:var(--bar); transition:width .2s; }
  #error { color:var(--danger); }
  #a2hs { color:var(--fg); border:1px solid var(--edge); border-radius:10px; padding:8px 12px; background:rgba(22,58,102,.6); }
  @media (prefers-reduced-motion: reduce) { #fill { transition:none; } }
  .wordmark { display:block; height:1.4em; width:auto; max-width:80vw; object-fit:contain; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="overlay">
    <h1><img class="wordmark" src="loading/wordmark-v2.png" alt="釣魚人生" width="720" height="240"></h1>
    <div id="track"><div id="fill"></div></div>
    <p id="status">載入中，遊戲即將開始</p>
    <p id="error" hidden></p>
    <p id="a2hs" hidden>想要全螢幕：點 Safari 下方的「分享」→「加入主畫面」，之後從主畫面打開。</p>
  </div>
</div>
<script>
(function () {
  var canvas = document.getElementById("unity-canvas"), overlay = document.getElementById("overlay");
  var statusEl = document.getElementById("status"), errorEl = document.getElementById("error"), fill = document.getElementById("fill");
  var started = false;
  function fail(msg) {
    statusEl.textContent = "遊戲沒有成功啟動。";
    errorEl.textContent = String(msg).slice(0, 300);
    errorEl.hidden = false; overlay.hidden = false;
  }
  window.addEventListener("error", function (e) { if (!started) fail(e.message || "載入檔案失敗"); });
  window.addEventListener("unhandledrejection", function (e) { if (!started) fail(e.reason || "載入失敗"); });
  // iPhone／iPad 用 Safari 直接開（不是從主畫面）：提示可以加入主畫面變全螢幕
  var ios = /iPhone|iPad|iPod/i.test(navigator.userAgent), standalone = window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches || window.matchMedia("(display-mode: fullscreen)").matches;
  if (ios && !standalone) document.getElementById("a2hs").hidden = false;
  // 擋掉雙指縮放、長按選單，避免玩到一半畫面被放大
  ["gesturestart", "gesturechange", "contextmenu"].forEach(function (n) { document.addEventListener(n, function (e) { e.preventDefault(); }, { passive: false }); });

  var config = {
    arguments: [],
    dataUrl: "Build/Web.data.unityweb",
    frameworkUrl: "Build/Web.framework.js.unityweb",
    codeUrl: "Build/Web.wasm.unityweb",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "TaiwanFishing",
    productName: "釣魚人生",
    productVersion: "0.1.0",
    showBanner: function (msg, type) { if (type === "error") fail(String(msg).replace(/<[^>]+>/g, "")); }
  };
  if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
  var script = document.createElement("script");
  script.src = "Build/Web.loader.js";
  script.onerror = function () { fail("讀不到遊戲載入程式"); };
  script.onload = function () {
    createUnityInstance(canvas, config, function (p) {
      fill.style.width = Math.round(p * 100) + "%";
    }).then(function () { started = true; overlay.hidden = true; canvas.focus(); }).catch(fail);
  };
  document.body.appendChild(script);
})();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>釣魚人生</title>
<meta name="description" content="在八斗子開船、拋竿、搏魚的 3D 釣魚遊戲。瀏覽器直接玩，手機電腦都可以。">
<meta name="theme-color" content="#0e2747">
<!-- 加入主畫面後全螢幕（iPhone、Android） -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="釣魚人生">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
<link rel="preload" as="image" href="loading/friends-portrait-v2.webp" media="(orientation:portrait)">
<link rel="preload" as="image" href="loading/friends-landscape-v2.webp" media="(orientation:landscape)">
<style>
  /* 合照、字標、進度分開：背景依橫直式切換，載入回呼沿用原版。 */
  :root { --bg:#0e2747; --fg:#fff; --bar:#52d5ff; color-scheme:dark; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--fg);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    overscroll-behavior:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  #stage { position:fixed; inset:0; height:100dvh; }
  #unity-canvas { display:block; width:100%; height:100%; background:var(--bg); outline:none; touch-action:none; }
  #overlay { --art-ratio:0.5627990431; position:absolute; inset:0; display:grid; place-items:center;
    overflow:hidden; isolation:isolate; text-align:center; pointer-events:none; background:#087e99; }
  #overlay::before { content:""; position:absolute; inset:-24px; z-index:-1;
    background:center/cover no-repeat url("loading/friends-portrait-v2.webp");
    filter:blur(18px) brightness(.62); transform:scale(1.06); }
  #overlay[hidden], #error[hidden], #a2hs[hidden] { display:none; }
  .loading-scene { position:relative; width:min(100vw,calc(100dvh * var(--art-ratio)));
    height:min(100dvh,calc(100vw / var(--art-ratio))); }
  .loading-art { position:absolute; inset:0; display:block; }
  .loading-art img { display:block; width:100%; height:100%; object-fit:contain; }
  .loading-title { position:absolute; z-index:1; left:50%; top:50%; transform:translate(-50%,-50%);
    width:80%; margin:0; line-height:0; }
  .wordmark { display:block; width:100%; height:auto; }
  .loading-ui { position:absolute; z-index:2; left:12%; right:12%; bottom:max(7%,env(safe-area-inset-bottom,0px)); display:flex;
    flex-direction:column; align-items:center; gap:10px; text-shadow:0 2px 3px #083750,0 0 8px #083750; }
  #track { box-sizing:border-box; width:100%; height:18px; border-radius:999px;
    background:rgba(5,69,93,.36); border:2px solid #fff; overflow:hidden;
    box-shadow:0 1px 5px rgba(0,48,76,.28); }
  #fill { width:0%; height:100%; background:linear-gradient(90deg,#5feaff,#21c5f4); border-radius:inherit;
    transition:width .2s; }
  p { margin:0; font-size:clamp(12px,3.4vw,16px); line-height:1.5; }
  #status { color:#fff; font-weight:600; letter-spacing:.04em; }
  #error { max-width:100%; padding:6px 10px; border-radius:8px; background:rgba(6,35,56,.88);
    color:#ffd5cb; font-size:13px; overflow-wrap:anywhere; text-shadow:none; }
  #a2hs { padding:5px 9px; border-radius:8px; background:rgba(6,35,56,.65); color:#fff;
    font-size:12px; text-shadow:none; }
  @media (orientation:landscape) {
    #overlay { --art-ratio:1.7768331562; }
    #overlay::before { background-image:url("loading/friends-landscape-v2.webp"); }
    /* 手機橫式比 16:9 更寬，背景鋪滿視窗，視覺重心保留在角色臉部。 */
    .loading-scene { width:100%; height:100%; }
    .loading-art img { object-fit:cover; object-position:50% 35%; }
    .loading-title { width:min(27vw,48dvh); }
    .loading-ui { left:30%; right:30%; bottom:max(5%,env(safe-area-inset-bottom,0px)); gap:8px; }
    #track { height:16px; }
    p { font-size:clamp(12px,1.5vw,16px); }
  }
  @media (orientation:landscape) and (max-height:480px) {
    .loading-ui { left:27%; right:27%; bottom:max(5%,env(safe-area-inset-bottom,0px)); gap:5px; }
    #track { height:13px; }
    #a2hs { font-size:10px; padding:3px 6px; }
    #error { font-size:11px; padding:3px 6px; }
  }
  @media (prefers-reduced-motion:reduce) { #fill { transition:none; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="overlay">
    <div class="loading-scene">
      <picture class="loading-art" aria-hidden="true">
        <source media="(orientation:landscape)" srcset="loading/friends-landscape-v2.webp">
        <img src="loading/friends-portrait-v2.webp" alt="" width="941" height="1672" fetchpriority="high" decoding="async">
      </picture>
      <h1 class="loading-title"><img class="wordmark" src="loading/wordmark-v2.png" alt="釣魚人生" width="720" height="240"></h1>
      <div class="loading-ui">
        <div id="track"><div id="fill"></div></div>
        <p id="status" role="status">載入中，遊戲即將開始</p>
        <p id="error" role="alert" hidden></p>
        <p id="a2hs" hidden>想要全螢幕：點 Safari 下方的「分享」→「加入主畫面」，之後從主畫面打開。</p>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  var canvas = document.getElementById("unity-canvas"), overlay = document.getElementById("overlay");
  var statusEl = document.getElementById("status"), errorEl = document.getElementById("error"), fill = document.getElementById("fill");
  var started = false;
  function fail(msg) {
    statusEl.textContent = "遊戲沒有成功啟動。";
    errorEl.textContent = String(msg).slice(0, 300);
    errorEl.hidden = false; overlay.hidden = false;
  }
  window.addEventListener("error", function (e) { if (!started) fail(e.message || "載入檔案失敗"); });
  window.addEventListener("unhandledrejection", function (e) { if (!started) fail(e.reason || "載入失敗"); });
  // iPhone／iPad 用 Safari 直接開（不是從主畫面）：提示可以加入主畫面變全螢幕
  var ios = /iPhone|iPad|iPod/i.test(navigator.userAgent), standalone = window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches || window.matchMedia("(display-mode: fullscreen)").matches;
  if (ios && !standalone) document.getElementById("a2hs").hidden = false;
  // 擋掉雙指縮放、長按選單，避免玩到一半畫面被放大
  ["gesturestart", "gesturechange", "contextmenu"].forEach(function (n) { document.addEventListener(n, function (e) { e.preventDefault(); }, { passive: false }); });

  var config = {
    arguments: [],
    dataUrl: "Build/Web.data.unityweb",
    frameworkUrl: "Build/Web.framework.js.unityweb",
    codeUrl: "Build/Web.wasm.unityweb",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "TaiwanFishing",
    productName: "釣魚人生",
    productVersion: "0.1.0",
    showBanner: function (msg, type) { if (type === "error") fail(String(msg).replace(/<[^>]+>/g, "")); }
  };
  if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
  var script = document.createElement("script");
  script.src = "Build/Web.loader.js";
  script.onerror = function () { fail("讀不到遊戲載入程式"); };
  script.onload = function () {
    createUnityInstance(canvas, config, function (p) {
      fill.style.width = Math.round(p * 100) + "%";
    }).then(function () { started = true; overlay.hidden = true; canvas.focus(); }).catch(fail);
  };
  document.body.appendChild(script);
})();
</script>
</body>
</html>

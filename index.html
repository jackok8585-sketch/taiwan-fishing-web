<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>釣魚人生</title>
<meta name="description" content="在八斗子開船、拋竿、搏魚的 3D 釣魚遊戲。瀏覽器直接玩，手機電腦都可以。">
<meta name="theme-color" content="#0e2747">
<!-- 加入主畫面後全螢幕（iPhone、Android） -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="釣魚人生">
<link rel="manifest" href="manifest.webmanifest?v=4">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=4">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=4">
<link rel="preload" as="image" href="loading/friends-px.png?v=2">
<style>
  /* 合照、字標、進度分開：背景依橫直式切換，載入回呼沿用原版。 */
  :root { --bg:#0e2747; --fg:#fff; --bar:#52d5ff; color-scheme:dark; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--fg);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    overscroll-behavior:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  #stage { position:fixed; inset:0; height:100dvh; }
  #unity-canvas { display:block; width:100%; height:100%; background:var(--bg); outline:none; touch-action:none; }
  /* 2026-11-27 讀取頁改成簡約版（使用者選定 B 暖白）：米白底、字標在中間、五隻像素角色站成一排、細的讀取條。舊的滿版合照留在 loading/ 沒有刪 */
  #overlay { position:absolute; inset:0; display:grid; place-items:center; overflow:hidden; text-align:center; pointer-events:none; background:#f4e8cf; }
  #overlay[hidden], #error[hidden], #a2hs[hidden] { display:none; }
  @font-face { font-family:"Cubic 11"; src:url("loading/Cubic_11.woff2") format("woff2"); font-display:swap; }
  .loading-scene { display:flex; flex-direction:column; align-items:center; width:min(86vw,460px); gap:clamp(18px,5dvh,46px);
    font-family:"Cubic 11","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; }
  .loading-title { width:min(100%,400px); margin:0; line-height:0; }
  .wordmark { display:block; width:100%; height:auto; image-rendering:pixelated; }
  .friends { width:100%; margin:0; padding-bottom:0; border-bottom:3px solid #1a1c2c; line-height:0; }
  .friends img { display:block; width:92%; height:auto; margin:0 auto; image-rendering:pixelated; }
  .loading-ui { display:flex; flex-direction:column; align-items:center; gap:10px; width:100%; }
  #trackwrap { position:relative; width:min(68%,300px); }
  #pct { position:absolute; left:calc(100% + 12px); top:50%; transform:translateY(-50%); color:#566c86; font-size:14px; white-space:nowrap; }
  #track { box-sizing:border-box; width:100%; height:18px; padding:3px; background:#e3d3b0; border:3px solid #1a1c2c; overflow:hidden; }
  #fill { width:0%; height:100%; background:repeating-linear-gradient(90deg,#ef7d57 0 11px,transparent 11px 14px); transition:width .2s; }
  p { margin:0; font-size:clamp(12px,3.4vw,16px); line-height:1.5; }
  #status { color:#566c86; font-weight:400; letter-spacing:.04em; }
  #error { max-width:100%; padding:6px 10px; background:#1a1c2c; color:#ffd5cb; font-size:13px; overflow-wrap:anywhere; }
  #a2hs { padding:5px 9px; background:#e3d3b0; color:#333c57; font-size:12px; }
  @media (orientation:landscape) and (max-height:480px) {
    .loading-scene { gap:12px; width:min(60vw,400px); }
    .loading-title { width:min(100%,260px); }
    .friends img { width:70%; }
    #a2hs { font-size:10px; padding:3px 6px; }
  }
  @media (prefers-reduced-motion:reduce) { #fill { transition:none; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="overlay">
    <div class="loading-scene">
      <h1 class="loading-title"><img class="wordmark" src="loading/wordmark-px.png" alt="釣魚人生" width="1296" height="432"></h1>
      <p class="friends" aria-hidden="true"><img src="loading/friends-px.png?v=2" alt="" width="972" height="232" fetchpriority="high"></p>
      <div class="loading-ui">
        <div id="trackwrap"><div id="track"><div id="fill"></div></div><span id="pct" aria-hidden="true"></span></div>
        <p id="status" role="status">載入中，遊戲即將開始</p>
        <p id="error" role="alert" hidden></p>
        <p id="a2hs" hidden>想要全螢幕：點 Safari 下方的「分享」→「加入主畫面」，之後從主畫面打開。</p>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  var canvas = document.getElementById("unity-canvas"), overlay = document.getElementById("overlay");
  var statusEl = document.getElementById("status"), errorEl = document.getElementById("error"), fill = document.getElementById("fill");
  var started = false;
  function fail(msg) {
    statusEl.textContent = "遊戲沒有成功啟動。";
    errorEl.textContent = String(msg).slice(0, 300);
    errorEl.hidden = false; overlay.hidden = false;
  }
  window.addEventListener("error", function (e) { if (!started) fail(e.message || "載入檔案失敗"); });
  window.addEventListener("unhandledrejection", function (e) { if (!started) fail(e.reason || "載入失敗"); });
  // iPhone／iPad 用 Safari 直接開（不是從主畫面）：提示可以加入主畫面變全螢幕
  var ios = /iPhone|iPad|iPod/i.test(navigator.userAgent), standalone = window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches || window.matchMedia("(display-mode: fullscreen)").matches;
  if (ios && !standalone) document.getElementById("a2hs").hidden = false;
  // 擋掉雙指縮放、長按選單，避免玩到一半畫面被放大
  ["gesturestart", "gesturechange", "contextmenu"].forEach(function (n) { document.addEventListener(n, function (e) { e.preventDefault(); }, { passive: false }); });

  var config = {
    arguments: [],
    dataUrl: "Build/Web.data.unityweb",
    frameworkUrl: "Build/Web.framework.js.unityweb",
    codeUrl: "Build/Web.wasm.unityweb",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "TaiwanFishing",
    productName: "釣魚人生",
    productVersion: "0.1.0",
    showBanner: function (msg, type) { if (type === "error") fail(String(msg).replace(/<[^>]+>/g, "")); }
  };
  if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 2);
  var script = document.createElement("script");
  script.src = "Build/Web.loader.js";
  script.onerror = function () { fail("讀不到遊戲載入程式"); };
  script.onload = function () {
    createUnityInstance(canvas, config, function (p) {
      fill.style.width = Math.round(p * 100) + "%";
      var pct = document.getElementById("pct"); if (pct) pct.textContent = Math.round(p * 100) + "%";
    }).then(function () { started = true; overlay.hidden = true; canvas.focus(); }).catch(fail);
  };
  document.body.appendChild(script);
})();
</script>
</body>
</html>
